name: Forge 1.16.5 CI

on:
  push:
    branches:
      - forge/1.16.5
  pull_request:
    branches:
      - forge/1.16.5

concurrency:
  group: forge-1.16.5-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 8
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '8'
          cache: gradle

      - name: Make Gradle wrapper executable
        run: chmod +x gradlew

      - name: Compile
        run: ./gradlew compileJava --stacktrace --no-daemon --console=plain
