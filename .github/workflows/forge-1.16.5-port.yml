name: Forge 1.16.5 Port

on:
  push:
    branches:
      - forge/1.16.5-port
  workflow_dispatch:

jobs:
  compile:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 8
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '8'
          cache: gradle

      - name: Make Gradle executable
        run: chmod +x gradlew

      - name: Compile
        run: ./gradlew compileJava --stacktrace --no-daemon
