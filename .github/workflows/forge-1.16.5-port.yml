name: Forge 1.16.5 Port

on:
  push:
    branches:
      - forge/1.16.5-port
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 8
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '8'

      - name: Restore Gradle cache
        id: gradle-cache
        uses: actions/cache/restore@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Make Gradle executable
        run: chmod +x gradlew

      - name: Build
        run: ./gradlew build --stacktrace --no-daemon

      - name: Forge runtime smoke test
        shell: bash
        run: |
          set +e
          ./gradlew runData --stacktrace --no-daemon 2>&1 | tee runData.log
          status=${PIPESTATUS[0]}
          if [ "$status" -ne 0 ]; then
            echo "===== runData failure summary ====="
            grep -E -i -B 3 -A 12 'exception|caused by|modloading|registry|mixin|error|failure' runData.log | tail -n 260 || true
            echo "===== runData tail ====="
            tail -n 220 runData.log || true
            echo "===== Forge runtime logs ====="
            find run -maxdepth 5 -type f \( -name 'latest.log' -o -name 'debug.log' -o -name 'crash-*.txt' \) -print -exec tail -n 220 {} \; 2>/dev/null || true
          fi
          exit "$status"

      - name: Save Gradle cache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ steps.gradle-cache.outputs.cache-primary-key }}