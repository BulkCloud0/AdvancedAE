buildscript {
    repositories {
        maven { url = 'https://maven.minecraftforge.net/' }
        maven { url = 'https://repo.spongepowered.org/repository/maven-public/' }
        mavenCentral()
    }
    dependencies {
        classpath group: 'net.minecraftforge.gradle', name: 'ForgeGradle', version: '5.1.65', changing: true
        classpath 'org.spongepowered:mixingradle:0.7-SNAPSHOT'
    }
}

apply plugin: 'java'
apply plugin: 'eclipse'
apply plugin: 'idea'
apply plugin: 'maven-publish'
apply plugin: 'net.minecraftforge.gradle'
apply plugin: 'org.spongepowered.mixin'

version = mod_version
group = mod_group_id
archivesBaseName = 'ExpansionAE'

sourceCompatibility = JavaVersion.VERSION_1_8
targetCompatibility = JavaVersion.VERSION_1_8

minecraft {
    mappings channel: mapping_channel, version: mapping_version
    accessTransformer = file('src/main/resources/META-INF/accesstransformer.cfg')

    runs {
        client {
            workingDirectory project.file('run')
            property 'forge.logging.console.level', 'info'
            mods { expansionae { source sourceSets.main } }
            arg '-mixin.config=mixins.aae.json'
            arg '-mixin.config=mixins.epp.json'
        }
        server {
            workingDirectory project.file('run')
            property 'forge.logging.console.level', 'info'
            mods { expansionae { source sourceSets.main } }
            arg '-mixin.config=mixins.aae.json'
            arg '-mixin.config=mixins.epp.json'
        }
        data {
            workingDirectory project.file('run')
            args '--mod', mod_id, '--all', '--output', file('src/generated/resources/'), '--existing', file('src/main/resources/')
            mods { expansionae { source sourceSets.main } }
        }
    }
}

// During the backport we keep the upstream source intact as a reference and
// deterministically emit Java-8-safe copies of the few very large classes that
// still contain newer language syntax. Once their API migration is complete,
// the generated copy can be folded back into src/main/java without changing
// runtime behaviour.
def legacyGeneratedDir = file("$buildDir/generated/sources/expansionaeLegacy/java")
def advPatternProviderPath = 'net/pedroksl/advanced_ae/common/logic/AdvPatternProviderLogic.java'

sourceSets.main.java {
    srcDir 'vendor/ExtendedAE/src/main/java'
    srcDir legacyGeneratedDir
    exclude advPatternProviderPath
}
sourceSets.main.resources { srcDir 'src/generated/resources' }

task prepareExpansionAELegacySources {
    inputs.file file("src/main/java/${advPatternProviderPath}")
    outputs.file file("${legacyGeneratedDir}/${advPatternProviderPath}")

    doLast {
        def sourceFile = file("src/main/java/${advPatternProviderPath}")
        def outFile = file("${legacyGeneratedDir}/${advPatternProviderPath}")
        outFile.parentFile.mkdirs()

        def text = sourceFile.getText('UTF-8')
        text = text.replace('import java.util.*;', 'import java.util.*;\n\nimport lombok.var;')

        text = text.replace('''        var unlockEventType = tag.getByte(NBT_UNLOCK_EVENT);\n        this.unlockEvent = switch (unlockEventType) {\n            case 0 -> null;\n            case 1 -> UnlockCraftingEvent.REDSTONE_POWER;\n            case 2 -> UnlockCraftingEvent.RESULT;\n            case 3 -> UnlockCraftingEvent.REDSTONE_PULSE;\n            default -> {\n                LOGGER.error("Unknown unlock event type {} in NBT for pattern provider: {}", unlockEventType, tag);\n                yield null;\n            }};''', '''        var unlockEventType = tag.getByte(NBT_UNLOCK_EVENT);\n        switch (unlockEventType) {\n            case 0:\n                this.unlockEvent = null;\n                break;\n            case 1:\n                this.unlockEvent = UnlockCraftingEvent.REDSTONE_POWER;\n                break;\n            case 2:\n                this.unlockEvent = UnlockCraftingEvent.RESULT;\n                break;\n            case 3:\n                this.unlockEvent = UnlockCraftingEvent.REDSTONE_PULSE;\n                break;\n            default:\n                LOGGER.error("Unknown unlock event type {} in NBT for pattern provider: {}", unlockEventType, tag);\n                this.unlockEvent = null;\n                break;\n        }''')

        text = text.replace('''        record PushTarget(Direction direction, PatternProviderTarget target) {}\n        var possibleTargets = new ArrayList<PushTarget>();''', '''        class PushTarget {\n            private final Direction direction;\n            private final PatternProviderTarget target;\n\n            PushTarget(Direction direction, PatternProviderTarget target) {\n                this.direction = direction;\n                this.target = target;\n            }\n\n            Direction direction() {\n                return this.direction;\n            }\n\n            PatternProviderTarget target() {\n                return this.target;\n            }\n        }\n        var possibleTargets = new ArrayList<PushTarget>();''')

        text = text.replace('''        switch (lockMode) {\n            case LOCK_UNTIL_PULSE -> {\n                if (getRedstoneState()) {\n                    // Already have signal, wait for no signal before switching to REDSTONE_POWER\n                    unlockEvent = UnlockCraftingEvent.REDSTONE_PULSE;\n                } else {\n                    // No signal, wait for signal\n                    unlockEvent = UnlockCraftingEvent.REDSTONE_POWER;\n                }\n                redstoneState = YesNo.UNDECIDED; // Check redstone state again next update\n                saveChanges();\n            }\n            case LOCK_UNTIL_RESULT -> {\n                unlockEvent = UnlockCraftingEvent.RESULT;\n                unlockStack = pattern.getPrimaryOutput();\n                saveChanges();\n            }\n        }''', '''        switch (lockMode) {\n            case LOCK_UNTIL_PULSE:\n                if (getRedstoneState()) {\n                    // Already have signal, wait for no signal before switching to REDSTONE_POWER\n                    unlockEvent = UnlockCraftingEvent.REDSTONE_PULSE;\n                } else {\n                    // No signal, wait for signal\n                    unlockEvent = UnlockCraftingEvent.REDSTONE_POWER;\n                }\n                redstoneState = YesNo.UNDECIDED; // Check redstone state again next update\n                saveChanges();\n                break;\n            case LOCK_UNTIL_RESULT:\n                unlockEvent = UnlockCraftingEvent.RESULT;\n                unlockStack = pattern.getPrimaryOutput();\n                saveChanges();\n                break;\n            default:\n                break;\n        }''')

        text = text.replace('''            switch (unlockEvent) {\n                case REDSTONE_POWER, REDSTONE_PULSE -> {\n                    return LockCraftingMode.LOCK_UNTIL_PULSE;\n                }\n                case RESULT -> {\n                    return LockCraftingMode.LOCK_UNTIL_RESULT;\n                }\n            }''', '''            switch (unlockEvent) {\n                case REDSTONE_POWER:\n                case REDSTONE_PULSE:\n                    return LockCraftingMode.LOCK_UNTIL_PULSE;\n                case RESULT:\n                    return LockCraftingMode.LOCK_UNTIL_RESULT;\n                default:\n                    break;\n            }''')

        text = text.replace('''        if (this.host instanceof Nameable nameable && nameable.hasCustomName()) {\n            var name = nameable.getCustomName();\n            return new PatternContainerGroup(this.host.getTerminalIcon(), name, List.of());\n        }''', '''        if (this.host instanceof Nameable && ((Nameable) this.host).hasCustomName()) {\n            Nameable nameable = (Nameable) this.host;\n            var name = nameable.getCustomName();\n            return new PatternContainerGroup(this.host.getTerminalIcon(), name, Collections.emptyList());\n        }''')
        text = text.replace('List<Component> tooltip = List.of();', 'List<Component> tooltip = Collections.emptyList();')

        outFile.setText(text, 'UTF-8')
    }
}

compileJava.dependsOn prepareExpansionAELegacySources

repositories {
    mavenCentral()
    maven { url = 'https://modmaven.dev/' }
    maven { url = 'https://maven.blamejared.com/' }
    maven {
        url = 'https://cursemaven.com'
        content { includeGroup 'curse.maven' }
    }
    maven { url = 'https://repo.spongepowered.org/repository/maven-public/' }
}

dependencies {
    minecraft "net.minecraftforge:forge:${minecraft_version}-${forge_version}"
    implementation fg.deobf("appeng:appliedenergistics2:${ae2_version}")

    implementation fg.deobf('curse.maven:geckolib-388172:4182600')
    implementation fg.deobf('curse.maven:curios-309927:4419403')
    compileOnly fg.deobf('curse.maven:jei-238222:5534622')

    // Java 8 local type inference used only by generated transitional sources.
    compileOnly 'org.projectlombok:lombok:1.18.30'
    annotationProcessor 'org.projectlombok:lombok:1.18.30'
    annotationProcessor 'org.spongepowered:mixin:0.8.5:processor'
}

mixin {
    add sourceSets.main, 'mixins.aae.refmap.json'
    config 'mixins.aae.json'
    config 'mixins.epp.json'
}

processResources {
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    inputs.property 'version', project.version

    from('vendor/ExtendedAE/src/main/resources') {
        exclude 'META-INF/mods.toml'
        exclude 'logo.png'
        exclude 'pack.mcmeta'
    }

    filesMatching('META-INF/mods.toml') {
        expand project.properties
    }
}

jar {
    manifest {
        attributes([
                'Specification-Title': mod_name,
                'Specification-Vendor': mod_authors,
                'Specification-Version': '1',
                'Implementation-Title': project.name,
                'Implementation-Version': project.version,
                'Implementation-Vendor': mod_authors,
                'MixinConfigs': 'mixins.aae.json,mixins.epp.json'
        ])
    }
}

jar.finalizedBy('reobfJar')

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}
