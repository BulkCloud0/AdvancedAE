buildscript {
    repositories {
        maven { url = 'https://maven.minecraftforge.net' }
        maven { url = 'https://repo.spongepowered.org/repository/maven-public' }
        mavenCentral()
    }
    dependencies {
        classpath group: 'net.minecraftforge.gradle', name: 'ForgeGradle', version: '5.1.+', changing: true
        classpath 'org.spongepowered:mixingradle:0.7-SNAPSHOT'
    }
}
apply plugin: 'java'
apply plugin: 'idea'
apply plugin: 'maven-publish'
apply plugin: 'net.minecraftforge.gradle'
apply plugin: 'org.spongepowered.mixin'
version = mod_version
group = mod_group_id
archivesBaseName = mod_name.replace(' ', '')
sourceCompatibility = targetCompatibility = compileJava.sourceCompatibility = compileJava.targetCompatibility = '1.8'

minecraft {
    mappings channel: mapping_channel, version: mapping_version
    accessTransformer = file('src/main/resources/META-INF/accesstransformer.cfg')
    runs {
        client { workingDirectory project.file('run'); property 'forge.logging.markers', 'REGISTRIES'; property 'forge.logging.console.level', 'debug'; mods { advanced_ae { source sourceSets.main } } }
        server { workingDirectory project.file('run'); property 'forge.logging.markers', 'REGISTRIES'; property 'forge.logging.console.level', 'debug'; mods { advanced_ae { source sourceSets.main } } }
        data { workingDirectory project.file('run'); property 'forge.logging.markers', 'REGISTRIES'; property 'forge.logging.console.level', 'debug'; args '--mod', mod_id, '--all', '--output', file('src/generated/resources/'), '--existing', file('src/main/resources/'); mods { advanced_ae { source sourceSets.main } } }
    }
}

sourceSets {
    main {
        java {
            exclude 'net/pedroksl/advanced_ae/datagen/**'
            exclude 'net/pedroksl/advanced_ae/client/**'
            exclude 'net/pedroksl/advanced_ae/gui/**'
            exclude 'net/pedroksl/advanced_ae/mixins/**'
            exclude 'net/pedroksl/advanced_ae/network/packet/**'
            exclude 'net/pedroksl/advanced_ae/events/**'
            exclude 'net/pedroksl/advanced_ae/recipes/**'
            exclude 'net/pedroksl/advanced_ae/xmod/**'
            exclude 'net/pedroksl/advanced_ae/common/inventory/**'
            exclude 'net/pedroksl/advanced_ae/common/patterns/**'
            exclude 'net/pedroksl/advanced_ae/common/fluids/**'
            exclude 'net/pedroksl/advanced_ae/common/items/armors/**'
            exclude 'net/pedroksl/advanced_ae/common/items/upgrades/**'
            exclude 'net/pedroksl/advanced_ae/common/items/AdvPatternEncoderItem.java'
            exclude 'net/pedroksl/advanced_ae/common/items/AAECraftingBlockItem.java'
            exclude 'net/pedroksl/advanced_ae/common/items/BlockUpgradeItem.java'
            exclude 'net/pedroksl/advanced_ae/common/parts/QuantumCrafterTerminalPart.java'
            exclude 'net/pedroksl/advanced_ae/common/parts/ThroughputMonitorPart.java'
            exclude 'net/pedroksl/advanced_ae/common/parts/StackTransferContextImpl.java'
            exclude 'net/pedroksl/advanced_ae/common/logic/ThroughputCache.java'
            exclude 'net/pedroksl/advanced_ae/common/helpers/AutoCraftingContainer.java'
            exclude 'net/pedroksl/advanced_ae/common/helpers/PickCraftMenuHost.java'
            exclude 'net/pedroksl/advanced_ae/common/helpers/PortableCellWorkbenchMenuHost.java'
            exclude 'net/pedroksl/advanced_ae/common/helpers/PortableCellWorkbench.java'
            exclude 'net/pedroksl/advanced_ae/common/helpers/PoweredItemCapabilities.java'
            exclude 'net/pedroksl/advanced_ae/common/helpers/RadiationShieldingProvider.java'
            exclude 'net/pedroksl/advanced_ae/common/helpers/StorageReader.java'
            exclude 'net/pedroksl/advanced_ae/common/helpers/StorageReaderImpl.java'
            exclude 'net/pedroksl/advanced_ae/common/helpers/FilteredImportStackTransferContext.java'
            exclude 'net/pedroksl/advanced_ae/common/helpers/ArmorHotkeyAction.java'
            exclude 'net/pedroksl/advanced_ae/common/helpers/ToggleUpgradeCardAction.java'
            exclude 'net/pedroksl/advanced_ae/common/helpers/MagnetHelpers.java'
            exclude 'net/pedroksl/advanced_ae/common/helpers/AAEColor.java'
            exclude 'net/pedroksl/advanced_ae/common/definitions/AAEHotkeysRegistry.java'
            exclude 'net/pedroksl/advanced_ae/common/definitions/AAEMenus.java'
            exclude 'net/pedroksl/advanced_ae/common/definitions/AAEFluids.java'
            exclude 'net/pedroksl/advanced_ae/common/definitions/AAETags.java'
            exclude 'net/pedroksl/advanced_ae/common/definitions/AAESlotSemantics.java'
            exclude 'net/pedroksl/advanced_ae/common/definitions/AAECreativeTab.java'
            exclude 'net/pedroksl/advanced_ae/common/logic/ExecutingCraftingJob.java'
            exclude 'net/pedroksl/advanced_ae/common/logic/ElapsedTimeTracker.java'
            exclude 'net/pedroksl/advanced_ae/common/blocks/ReactionChamberBlock.java'
            exclude 'net/pedroksl/advanced_ae/common/entities/ReactionChamberEntity.java'
            exclude 'net/pedroksl/advanced_ae/common/blocks/QuantumCrafterBlock.java'
            exclude 'net/pedroksl/advanced_ae/common/entities/QuantumCrafterEntity.java'
            exclude 'net/pedroksl/advanced_ae/common/blocks/AdvPatternProviderBlock.java'
            exclude 'net/pedroksl/advanced_ae/common/blocks/SmallAdvPatternProviderBlock.java'
            exclude 'net/pedroksl/advanced_ae/common/entities/AdvPatternProviderEntity.java'
            exclude 'net/pedroksl/advanced_ae/common/entities/SmallAdvPatternProviderEntity.java'
            exclude 'net/pedroksl/advanced_ae/common/logic/AdvPatternProvider*.java'
            exclude 'net/pedroksl/advanced_ae/common/parts/AdvPatternProviderPart.java'
            exclude 'net/pedroksl/advanced_ae/common/parts/SmallAdvPatternProviderPart.java'
            exclude 'net/pedroksl/advanced_ae/common/items/AdvPatternProvider*UpgradeItem.java'
        }
        resources { srcDir 'src/generated/resources' }
    }
}

repositories {
    mavenLocal(); mavenCentral()
    maven { name = 'ModMaven'; url = 'https://modmaven.dev/'; content { includeGroup 'appeng' } }
    maven { url = 'https://www.cursemaven.com'; content { includeGroup 'curse.maven' } }
    maven { url = 'https://maven.blamejared.com' }
    maven { url = 'https://dvs1.progwml6.com/files/maven/' }
}
dependencies {
    minecraft "net.minecraftforge:forge:${minecraft_version}-${forge_version}"
    implementation fg.deobf("appeng:appliedenergistics2:${ae2_version}")
    compileOnly 'org.jetbrains:annotations:22.0.0'
    annotationProcessor 'org.spongepowered:mixin:0.8.4:processor'
}
mixin { add sourceSets.main, 'mixins.aae.refmap.json'; config 'mixins.aae.json' }
processResources {
    inputs.property 'version', mod_version
    inputs.property 'minecraft_version_range', minecraft_version_range
    inputs.property 'forge_version_range', forge_version_range
    inputs.property 'loader_version_range', loader_version_range
    filesMatching('META-INF/mods.toml') { expand([mod_id: mod_id, mod_name: mod_name, mod_license: mod_license, mod_version: mod_version, mod_authors: mod_authors, mod_description: mod_description, minecraft_version_range: minecraft_version_range, forge_version_range: forge_version_range, loader_version_range: loader_version_range, ae2_version: ae2_version]) }
}
jar { manifest { attributes(['MixinConfigs': 'mixins.aae.json']) } }
jar.finalizedBy('reobfJar')
publishing { publications { mavenJava(MavenPublication) { artifact jar } }; repositories { maven { url "file://${project.projectDir}/mcmodsrepo" } } }
tasks.withType(JavaCompile).configureEach { options.encoding = 'UTF-8' }
