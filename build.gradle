buildscript {
    repositories {
        maven { url = 'https://maven.minecraftforge.net' }
        maven { url = 'https://repo.spongepowered.org/repository/maven-public' }
        maven { url = 'https://maven.parchmentmc.org' }
        mavenCentral()
    }
    dependencies {
        classpath group: 'net.minecraftforge.gradle', name: 'ForgeGradle', version: '5.1.+', changing: true
        classpath 'org.spongepowered:mixingradle:0.7-SNAPSHOT'
        classpath 'org.parchmentmc:librarian:1.+'
    }
}

apply plugin: 'java'
apply plugin: 'idea'
apply plugin: 'maven-publish'
apply plugin: 'net.minecraftforge.gradle'
apply plugin: 'org.parchmentmc.librarian.forgegradle'
apply plugin: 'org.spongepowered.mixin'

version = mod_version
group = mod_group_id
archivesBaseName = mod_name.replace(' ', '')

sourceCompatibility = targetCompatibility = compileJava.sourceCompatibility = compileJava.targetCompatibility = '1.8'

minecraft {
    mappings channel: mapping_channel, version: mapping_version

    accessTransformer = file('src/main/resources/META-INF/accesstransformer.cfg')

    runs {
        client {
            workingDirectory project.file('run')
            property 'forge.logging.markers', 'REGISTRIES'
            property 'forge.logging.console.level', 'debug'
            mods {
                advanced_ae {
                    source sourceSets.main
                }
            }
        }

        server {
            workingDirectory project.file('run')
            property 'forge.logging.markers', 'REGISTRIES'
            property 'forge.logging.console.level', 'debug'
            mods {
                advanced_ae {
                    source sourceSets.main
                }
            }
        }

        data {
            workingDirectory project.file('run')
            property 'forge.logging.markers', 'REGISTRIES'
            property 'forge.logging.console.level', 'debug'
            args '--mod', mod_id, '--all', '--output', file('src/generated/resources/'), '--existing', file('src/main/resources/')
            mods {
                advanced_ae {
                    source sourceSets.main
                }
            }
        }
    }
}

// 1.16.5 baseline: keep modern-only source available for later backporting,
// but do not compile it until its AE2/Forge APIs have been ported.
sourceSets {
    main {
        java {
            exclude 'net/pedroksl/advanced_ae/datagen/**'
            exclude 'net/pedroksl/advanced_ae/common/blocks/AdvPatternProviderBlock.java'
            exclude 'net/pedroksl/advanced_ae/common/blocks/SmallAdvPatternProviderBlock.java'
            exclude 'net/pedroksl/advanced_ae/common/entities/AdvPatternProviderEntity.java'
            exclude 'net/pedroksl/advanced_ae/common/entities/SmallAdvPatternProviderEntity.java'
            exclude 'net/pedroksl/advanced_ae/common/logic/AdvPatternProvider*.java'
            exclude 'net/pedroksl/advanced_ae/common/parts/AdvPatternProviderPart.java'
            exclude 'net/pedroksl/advanced_ae/common/parts/SmallAdvPatternProviderPart.java'
            exclude 'net/pedroksl/advanced_ae/common/items/AdvPatternProvider*UpgradeItem.java'
            exclude 'net/pedroksl/advanced_ae/gui/advpatternprovider/**'
            exclude 'net/pedroksl/advanced_ae/client/gui/AdvPatternProviderScreen.java'
            exclude 'net/pedroksl/advanced_ae/client/gui/SmallAdvPatternProviderScreen.java'
            exclude 'net/pedroksl/advanced_ae/mixins/appflux/**'
            exclude 'net/pedroksl/advanced_ae/xmod/appflux/**'
        }
        resources {
            srcDir 'src/generated/resources'
        }
    }
}

repositories {
    mavenLocal()
    mavenCentral()
    maven {
        name = 'ModMaven'
        url = 'https://modmaven.dev/'
        content { includeGroup 'appeng' }
    }
    maven {
        url = 'https://www.cursemaven.com'
        content { includeGroup 'curse.maven' }
    }
    maven { url = 'https://maven.blamejared.com' }
    maven { url = 'https://dvs1.progwml6.com/files/maven/' }
}

dependencies {
    minecraft "net.minecraftforge:forge:${minecraft_version}-${forge_version}"

    implementation fg.deobf("appeng:appliedenergistics2:${ae2_version}")

    compileOnly 'org.jetbrains:annotations:22.0.0'
    annotationProcessor 'org.spongepowered:mixin:0.8.4:processor'
}

mixin {
    add sourceSets.main, 'mixins.aae.refmap.json'
    config 'mixins.aae.json'
}

processResources {
    inputs.property 'version', mod_version
    inputs.property 'minecraft_version_range', minecraft_version_range
    inputs.property 'forge_version_range', forge_version_range
    inputs.property 'loader_version_range', loader_version_range

    filesMatching('META-INF/mods.toml') {
        expand([
                mod_id: mod_id,
                mod_name: mod_name,
                mod_license: mod_license,
                mod_version: mod_version,
                mod_authors: mod_authors,
                mod_description: mod_description,
                minecraft_version_range: minecraft_version_range,
                forge_version_range: forge_version_range,
                loader_version_range: loader_version_range,
                ae2_version: ae2_version
        ])
    }
}

jar {
    manifest {
        attributes([
                'MixinConfigs': 'mixins.aae.json'
        ])
    }
}

jar.finalizedBy('reobfJar')

publishing {
    publications {
        mavenJava(MavenPublication) {
            artifact jar
        }
    }
    repositories {
        maven {
            url "file://${project.projectDir}/mcmodsrepo"
        }
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}
